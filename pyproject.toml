[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-operational-intelligence"
version = "0.1.0"
description = "Synthetic operational telemetry, anomaly detection, and evidence-grounded RCA"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "openai>=1.66",
  "python-dotenv>=1.0,<2",
  "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = ["httpx>=0.27", "pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
