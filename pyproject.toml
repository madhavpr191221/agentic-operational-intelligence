[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-operational-intelligence"
version = "0.1.0"
description = "Synthetic operational telemetry, anomaly detection, and evidence-grounded RCA"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "openai>=1.66",
  "openai-agents>=0.25.0",
  "pypdf>=6.0,<7",
  "python-dotenv>=1.0,<2",
  "reportlab>=4.2,<5",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
rag-gpu = [
  "sentence-transformers>=5.1,<6",
  "torch>=2.12,<3",
  "usearch>=2.17,<3",
]

[dependency-groups]
dev = ["httpx>=0.27", "pytest>=8.0"]

[tool.uv]

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", extra = "rag-gpu" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
